name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is Raspberry Pi OS Bookworm's default; 3.12 is what a desktop
        # install gives you.
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pyflakes

      - name: Lint (the firmware must stay lean)
        run: python -m pyflakes micropython/ smarthome/ tools/

      - name: Run the test suite
        # The browser UI tests need Chromium and skip themselves when it is
        # absent, so this job stays hermetic and fast.
        run: python -m pytest -q

  micropython:
    name: firmware compiles under MicroPython
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MicroPython (conda-forge unix build)
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          python-version: "3.12"
          activate-environment: mpy
          channels: conda-forge
          channel-priority: strict

      - name: Install the interpreter
        shell: bash -el {0}
        run: conda install -y -c conda-forge micropython

      - name: Compile every firmware file
        shell: bash -el {0}
        run: python scripts/mpy_check.py --interpreter "$(command -v micropython)"

      - name: Import and exercise the firmware
        shell: bash -el {0}
        run: python scripts/mpy_imports.py --interpreter "$(command -v micropython)"
